name: Saku Overclock CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode (manual start)'
        required: true
        default: 'installer'
        type: choice
        options:
          - installer
          - full
          - none

env:
  SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
  SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
  SIGNPATH_PROJECT_SLUG: 'Saku_Overclock'
  SIGNING_POLICY: 'Saku_Overclock_Unpacked_Test'

jobs:
  check-commit:
    runs-on: ubuntu-latest
    outputs:
      build_mode: ${{ steps.check.outputs.build_mode }}
    steps:
      - name: Determine build mode
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_mode=${{ inputs.build_mode }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MSG="${{ github.event.pull_request.title }}"
          else
            MSG="${{ github.event.head_commit.message }}"
          fi

          echo "Message: $MSG"

          if [[ "$MSG" == *"build-ss"* ]]; then
            echo "build_mode=full" >> "$GITHUB_OUTPUT"
          elif [[ "$MSG" == *"build-is"* ]]; then
            echo "build_mode=installer" >> "$GITHUB_OUTPUT"
          else
            echo "build_mode=none" >> "$GITHUB_OUTPUT"
          fi

  build-and-package:
    needs: check-commit
    if: needs.check-commit.outputs.build_mode != 'none'
    runs-on: windows-latest
    env:
      BUILD_MODE: ${{ needs.check-commit.outputs.build_mode }}
      PUBLISH_DIR: Saku Overclock\bin\Release\net10.0-windows10.0.19041.0\win-x64\publish

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup MSBuild Tooling
      uses: microsoft/setup-msbuild@v2

    - name: Restore Solution (win-x64)
      shell: powershell
      run: dotnet restore "Saku Overclock.sln" -r win-x64

    # ---------- Сборка бинарников ----------
    - name: Publish App (Release win-x64)
      shell: powershell
      run: |
        dotnet publish "Saku Overclock\Saku Overclock.csproj" `
          -c Release `
          -r win-x64 `
          -p:Platform=x64 `
          -p:TargetFramework=net10.0-windows10.0.19041.0

    # ---------- ЭТАП 1: Подпись внутренних бинарников (Inner Sign) ----------
    - name: Stage Binaries for Stage 1
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "Stage1_Unsigned" | Out-Null
        Copy-Item "$env:PUBLISH_DIR\Saku Overclock.exe" "Stage1_Unsigned\"
        Copy-Item "$env:PUBLISH_DIR\Saku Overclock.Service.exe" "Stage1_Unsigned\"
        # Если нужно подписать DLL, раскомментируй следующую строку:
        # Copy-Item "$env:PUBLISH_DIR\*.dll" "Stage1_Unsigned\"

    - name: Upload Unsigned Binaries
      id: upload_stage1
      uses: actions/upload-artifact@v4
      with:
        name: Stage1-Unsigned-Binaries
        path: Stage1_Unsigned
        compression-level: 9

    - name: SignPath Stage 1 (fp_start)
      uses: signpath/github-action-submit-signing-request@v1.3
      with:
        api-token: '${{ env.SIGNPATH_API_TOKEN }}'
        organization-id: '${{ env.SIGNPATH_ORG_ID }}'
        project-slug: '${{ env.SIGNPATH_PROJECT_SLUG }}'
        signing-policy-slug: '${{ env.SIGNING_POLICY }}'
        github-artifact-id: '${{ steps.upload_stage1.outputs.artifact-id }}'
        artifact-configuration-slug: 'fp_start'
        wait-for-completion: true
        output-artifact-directory: '${{ github.workspace }}\Stage1_Signed'

    - name: Inject Signed Binaries back to Publish Dir
      shell: powershell
      run: |
        Write-Output "Replacing unsigned binaries with signed ones..."
        Copy-Item "Stage1_Signed\*" "$env:PUBLISH_DIR\" -Force -Recurse

    # ---------- Сборка установщиков ----------
    - name: Build Installer (WiX Bundle + MSI)
      shell: powershell
      run: |
        # WiX подхватит уже подписанные exe/dll из PUBLISH_DIR
        dotnet build "Setup\SakuBundle\SakuBundle.wixproj" -c Release

    - name: Compile and Package MSIX
      if: env.BUILD_MODE == 'full'
      shell: powershell
      run: |
        # Собираем MSIX. Неважно, что он сгенерирует файлы заново, 
        # SignPath проникнет внутрь пакета на Этапе 2 и переподпишет их.
        msbuild "Saku Overclock\Saku Overclock.csproj" `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:EnableMsixTooling=true `
          /p:GenerateAppxPackageOnBuild=true `
          /p:AppxPackageSigningEnabled=false `
          /p:AppxPackageDir="${{ github.workspace }}\BuildArtifacts\MSIX\" `
          /p:AppxBundle=Never

    # ---------- ЭТАП 2: Подпись релизных пакетов (Outer Sign) ----------
    - name: Stage Installers for Stage 2
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "Stage2_Unsigned" | Out-Null
        Copy-Item "Setup\SakuBundle\bin\Release\SakuOverclock-Setup.exe" "Stage2_Unsigned\"
        Copy-Item "Setup\SakuMsi\bin\Release\SakuOverclock.msi" "Stage2_Unsigned\"
        
        if ($env:BUILD_MODE -eq 'full') {
            $msixFile = (Get-ChildItem -Path "${{ github.workspace }}\BuildArtifacts\MSIX" -Filter "*.msix" -Recurse | Select-Object -First 1).FullName
            if ($msixFile) {
                Copy-Item $msixFile "Stage2_Unsigned\"
            }
        }

    - name: Upload Unsigned Installers
      id: upload_stage2
      uses: actions/upload-artifact@v4
      with:
        name: Stage2-Unsigned-Installers
        path: Stage2_Unsigned
        compression-level: 9

    - name: SignPath Stage 2 (pp_end)
      uses: signpath/github-action-submit-signing-request@v1.3
      with:
        api-token: '${{ env.SIGNPATH_API_TOKEN }}'
        organization-id: '${{ env.SIGNPATH_ORG_ID }}'
        project-slug: '${{ env.SIGNPATH_PROJECT_SLUG }}'
        signing-policy-slug: '${{ env.SIGNING_POLICY }}'
        github-artifact-id: '${{ steps.upload_stage2.outputs.artifact-id }}'
        artifact-configuration-slug: 'pp_end'
        wait-for-completion: true
        output-artifact-directory: '${{ github.workspace }}\Stage2_Signed'

    # ---------- Финализация ----------
    - name: Verify Final Signatures
      shell: powershell
      run: |
        $files = Get-ChildItem -Path "${{ github.workspace }}\Stage2_Signed" -Include "*.exe","*.msi","*.msix" -Recurse
        foreach ($file in $files) {
          $signature = Get-AuthenticodeSignature $file.FullName
          if ($signature.Status -ne "Valid") {
            Write-Error "Invalid signature on $($file.Name): $($signature.Status)"
            exit 1
          } else {
            Write-Host "::notice::✓ $($file.Name): $($signature.SignerCertificate.Subject)"
          }
        }

    - name: Upload Signed Installer (Bundle EXE)
      uses: actions/upload-artifact@v4
      with:
        name: Saku-Overclock-Signed-Installer
        # Ищем exe бандл в распакованной папке от SignPath
        path: Stage2_Signed/**/*-Setup.exe 
        if-no-files-found: error

    - name: Upload Signed OEM (MSI)
      uses: actions/upload-artifact@v4
      with:
        name: Saku-Overclock-Signed-OEM-MSI
        # Ищем msi
        path: Stage2_Signed/**/*.msi
        if-no-files-found: error

    - name: Upload Signed MSIX Package
      if: env.BUILD_MODE == 'full'
      uses: actions/upload-artifact@v4
      with:
        name: Saku-Overclock-Signed-MSIX
        # Ищем msix
        path: Stage2_Signed/**/*.msix
        if-no-files-found: error
